version: '3.4'

# Common Django template for Waterproof, Celery services below
x-common-django:
  &default-common-django
  image: waterproof/spcwaterproof:django-3.2
  build:
    context: ../../
    dockerfile: scripts_docker/spcwaterproof/django/Dockerfile
  env_file:
    - .env
  volumes:
    - static:/spcwaterproof-static/
    - media:/spcwaterproof-media/
    - /data/outputs/:/app/outputs/
  restart: always

services:

  # Our custom django application. It includes Geonode.
  django:
    << : *default-common-django
    healthcheck:
      test: ["CMD", "/spcwaterproof/scripts_docker/spcwaterproof/django/healthcheck.sh"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    init: true
    entrypoint: ["/spcwaterproof/scripts_docker/spcwaterproof/django/docker-entrypoint.sh"]
    command: "uwsgi --chdir=/spcwaterproof --module=geonode.wsgi --socket=:8000 --http=127.0.0.1:8001 --master --processes=4 --threads=4 --buffer-size=32768 --listen=256 --harakiri=180 --post-buffering=32768 --max-requests=5000 --reload-on-rss=2048 --worker-reload-mercy=90 --socket-timeout=60"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Celery worker that executes celery tasks created by Django.
  celery:
    << : *default-common-django
    entrypoint: []
    command: 'celery -A geonode.celery_app:app worker --without-gossip --without-mingle -Ofair -B -E --statedb=/spcwaterproof-static/worker.state -s /spcwaterproof-static/celerybeat-schedule --loglevel=INFO --concurrency=16 -n worker1@%h'
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Nginx is serving django static and media files and proxies to django and waterproof
  nginx:
    image: waterproof/spcwaterproof:nginx-3.2
    build: ./nginx/
    environment:
      - HTTPS_HOST=${HTTPS_HOST}
      - HTTP_HOST=${HTTP_HOST}
      - HTTPS_PORT=${HTTPS_PORT}
      - HTTP_PORT=${HTTP_PORT}
      - LETSENCRYPT_MODE=${LETSENCRYPT_MODE}
      - RESOLVER=127.0.0.11
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - static:/spcwaterproof-static/
      - media:/spcwaterproof-media/
      - certificates:/spcwaterproof-certificates/
      - ./nginx/spcwaterproof.conf:/etc/nginx/spcwaterproof.conf:ro
    sysctls:
      net.core.somaxconn: 4096
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: on-failure

  # Geoserver backend
  geoserver-2-27-2:
    image: waterproof/spcwaterproof:geoserver-2.27.2
    build:
      context: ./docker-geoserver/
      args:
        GS_VERSION: 2.27.2
        IMAGE_VERSION: 9.0.102-jdk17-temurin-jammy
        WAR_URL: https://downloads.sourceforge.net/project/geoserver/GeoServer/2.27.2/geoserver-2.27.2-war.zip
    container_name: geoserver-2-27-2-4${COMPOSE_PROJECT_NAME}
    environment:
      - HTTP_PROXY_NAME=${HTTPS_HOST}
      - HTTP_SCHEME=https
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=G3053rv3rTnc
      - GEOSERVER_DATA_DIR=/spcwaterproof-geodatadir
    restart: on-failure
    volumes:
      - geodatadir5:/spcwaterproof-geodatadir/
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    
  # Gets and installs letsencrypt certificates
  letsencrypt:
    image: waterproof/spcwaterproof:letsencrypt-3.2
    build: ./letsencrypt/
    environment:
      - HTTPS_HOST=${HTTPS_HOST}
      - HTTP_HOST=${HTTP_HOST}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - LETSENCRYPT_MODE=${LETSENCRYPT_MODE}
    volumes:
      - certificates:/spcwaterproof-certificates/
    restart: on-failure

  # dumps the non geodata db
  pgdumper_nogeo:
    container_name: dumper_${GEONODE_DATABASE}_${COMPOSE_PROJECT_NAME}
    image: waterproof/spcwaterproof:pgdumper-3.2
    build: ./pgdumper/
    volumes:
      - pgdumps:/spcwaterproof-pgdumps/
    restart: on-failure
    environment:
      - DATABASE=${GEONODE_DATABASE}
      - DATABASE_URL=postgres://${GEONODE_DATABASE_USER}:${GEONODE_DATABASE_PASSWORD}@postgres:${POSTGRES_PORT}/${GEONODE_DATABASE}
  
  # dumps the geodata db
  pgdumper_geo:
    container_name: dumper_${GEONODE_GEODATABASE}_${COMPOSE_PROJECT_NAME}
    image: waterproof/spcwaterproof:pgdumper-3.2
    build: ./pgdumper/
    volumes:
      - pgdumps:/spcwaterproof-pgdumps/
    restart: on-failure
    environment:
      - DATABASE=${GEONODE_GEODATABASE}
      # pgdumper needs postgis:// as connection string for the geodatabase
      - DATABASE_URL=postgres://${GEONODE_GEODATABASE_USER}:${GEONODE_GEODATABASE_PASSWORD}@postgres:5432/${GEONODE_GEODATABASE}

  rclone:
    image: waterproof/spcwaterproof:rclone-3.2
    build: ./rclone/
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
    volumes:
      - pgdumps:/spcwaterproof-pgdumps/
      - media:/spcwaterproof-media/
      - geodatadir:/spcwaterproof-geodatadir/
    restart: on-failure

  # PostGIS database.
  postgres:
    # use waterproof official postgis 11 image
    image: waterproof/postgis:latest
    build: ./postgis/
    environment:
      # database info, ${variables} are read from .env
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GEONODE_DATABASE=${GEONODE_DATABASE}
      - GEONODE_DATABASE_PASSWORD=${GEONODE_DATABASE_PASSWORD}
      - GEONODE_GEODATABASE=${GEONODE_GEODATABASE}
      - GEONODE_GEODATABASE_PASSWORD=${GEONODE_GEODATABASE_PASSWORD}
      - DATABASE_URL=postgres://${GEONODE_DATABASE_USER}:${GEONODE_DATABASE_PASSWORD}@postgres:5432/${GEONODE_DATABASE}
      - GEODATABASE_URL=postgis://${GEONODE_GEODATABASE_USER}:${GEONODE_GEODATABASE_PASSWORD}@postgres:5432/${GEONODE_GEODATABASE}
    volumes:
      - database:/var/lib/postgresql/data/
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: on-failure
    # uncomment to enable remote connections to postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"

  # Vanilla RabbitMQ service. This is needed by celery
  rabbitmq:
    image: rabbitmq:3.7-alpine
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: on-failure

  # Mapserver service. This is needed by geonode
  mapserver:
    image: camptocamp/mapserver:master
    volumes:
      - /data/outputs:/etc/mapserver
    ports:
      - "82:80"

  # MariaDB for moodle
  mariadb:
    image: docker.io/bitnami/mariadb:10.6
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      # - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_moodle
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
      - MARIADB_PASSWORD=TnC&M00dl3*.
      - MARIADB_ROOT_PASSWORD=TnC&M00dl3*.
      - BITNAMI_DEBUG=true
    volumes:
      - 'mariadb_data:/bitnami/mariadb'  
  # moodle
  moodle:
    image: docker.io/bitnami/moodle:4
    ports:
      - '85:8080'
      - '445:8443'
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_PASSWORD=TnC&M00dl3*.
      - MOODLE_REVERSEPROXY=true
      #- MOODLE_SSLPROXY=true
      - MOODLE_HOST=water-proof.org/learning
      - BITNAMI_DEBUG=true
    volumes:
      - 'moodle_data:/bitnami/moodle'
      - 'moodledata_data:/bitnami/moodledata'
    depends_on:
      - mariadb

# MariaDB for moodle
  mariadb-latest:
    image: docker.io/bitnami/mariadb:latest
    environment:      
      - MARIADB_USER=bn_moodle
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
      - MARIADB_PASSWORD=TnC&M00dl3*.
      - MARIADB_ROOT_PASSWORD=TnC&M00dl3*.
      - BITNAMI_DEBUG=true
    volumes:
      - 'mariadb_data1:/bitnami/mariadb'  
  # moodle
  moodle-4-5:
    image: docker.io/bitnami/moodle:4.5
    ports:
      - '85:8080'
      - '445:8443'
    environment:
      - MOODLE_DATABASE_HOST=mariadb-latest
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_PASSWORD=TnC&M00dl3*.
      - MOODLE_REVERSEPROXY=true      
      - MOODLE_HOST=dev.water-proof.org/learning
      - BITNAMI_DEBUG=true
    volumes:
      - 'moodle_data1:/bitnami/moodle'
      - 'moodledata_data1:/bitnami/moodledata'
    depends_on:
      - mariadb-latest
      
volumes:
  static:
  media:
  database:
  geodatadir:
  geodatadir5:
  certificates:
  pgdumps:
  rabbitmq:
  mapserver:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local
  mariadb_data1:
    driver: local
  moodle_data1:
    driver: local
  moodledata_data1:
    driver: local

networks:
  geonode:
    driver: bridge
