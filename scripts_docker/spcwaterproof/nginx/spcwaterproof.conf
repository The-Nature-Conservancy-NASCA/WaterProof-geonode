# This is the main geogeonode conf

# Bloquear IPs de bots agresivos (variable definida en nginx.conf)
if ($blocked_ip) {
    return 444;
}
charset     utf-8;

# max upload size
client_max_body_size 100G;
client_body_buffer_size 256K;
large_client_header_buffers 4 64k;

# timeout configurations
proxy_connect_timeout       30s;
proxy_send_timeout          120s;
proxy_read_timeout          120s;
send_timeout                120s;
client_header_timeout       60s;
client_body_timeout         60s;

# uwsgi timeout configurations
uwsgi_connect_timeout       30s;
uwsgi_send_timeout          120s;
uwsgi_read_timeout          120s;

# compression
gzip on;
gzip_proxied any;
gzip_types
    text/css
    text/javascript
    text/xml
    text/plain
    application/javascript
    application/x-javascript
    application/json;

# Geoserver
location /geoserver {

    # Using a variable is a trick to let Nginx start even if upstream host is not up yet
    # (see https://sandro-keil.de/blog/2017/07/24/let-nginx-start-if-upstream-host-is-unavailable-or-down/)
    #set $upstream geoserver:8080;
    set $upstream geoserver-2-27-2:8080;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;

    rewrite /rest/about/ /geoserver;
    rewrite /rest/settings /geoserver;
    rewrite /rest/settings/ /geoserver;    
    #rewrite /web/ https://water-proof.org/;
    
    proxy_pass http://$upstream;
}

location /pygeoapi/ {
    set $upstream 4988fba814c4;
    proxy_set_header Host $http_host;
    proxy_set_header X-Script-Name /pygeoapi;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_pass http://$upstream/;
}

# proxy reverse to wfapp_models
location /wf-models {

    set $upstream wfapp_py3:8000;
    proxy_pass http://$upstream;
}
# proxy reverse to waterproof-adapter-fastflood_api_1
location /wp-fastflood/ {
    proxy_pass http://waterproof-adapter-fastflood_api_1:8000/;
    # Headers esenciales
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;

    # Mantener el path original
    proxy_set_header X-Original-URI $request_uri;

    # Configuración adicional
    proxy_redirect off;
    proxy_buffering off;
}

# proxy reverse to wf-rios
location /wf-rios {

    # Using a variable is a trick to let Nginx start even if upstream host is not up yet
    # (see https://sandro-keil.de/blog/2017/07/24/let-nginx-start-if-upstream-host-is-unavailable-or-down/)
    set $upstream wfapp_py2:5050;
    proxy_pass http://$upstream;
}

#/srvstatus.chl+: Abyss allows hidden/protected files to be served if a + is added to the request. CVE-2002-1081.
location /srvst{
    return 404;
}

# proxy reverse to mapserver
location /srv{

    set $upstream mapserver;
    #set $upstream mapserver:82;
    proxy_pass http://$upstream;
}

# proxy reverse to Flower
location /flower{

    set $upstream flower:5556;
    proxy_set_header  Host $http_host;
    proxy_redirect off;

    proxy_set_header  X-Real-IP $remote_addr;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://$upstream;
}

# proxy reverse to moodle
location /learning/{
    
    #set $upstream moodle:85;    
    #proxy_pass http://$upstream;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection 'upgrade';
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_cache_bypass $http_upgrade;
	proxy_pass_request_headers   on;
    proxy_pass http://moodle-4-5:8080/;
}

# Django media
location /uploaded  {
    alias /spcwaterproof-media;  # your Django project's media files - amend as required
    include  /etc/nginx/mime.types;
    expires 365d;
    
    # Optimización específica para archivos media
    location ~* \.(png|jpg|jpeg|gif|ico|svg|pdf|mp4|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}

location /static {
    alias /spcwaterproof-static; # your Django project's static files - amend as required
    include  /etc/nginx/mime.types;
    expires 365d;
    
    # Optimización específica para archivos estáticos
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000";
        add_header Vary Accept-Encoding;
        gzip_static on;
    }
    
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}

location /inputs{
   alias /spcwaterproof-inputs/; 
   index index.html; 
   autoindex on;
}

location /outputs{
   alias /spcwaterproof-outputs/; 
   index index.html; 
   autoindex on;
}

# Finally, send all non-media requests to the Django server.
location / {
    # uwsgi_params
    include /etc/nginx/uwsgi_params;

    # Using a variable is a trick to let Nginx start even if upstream host is not up yet
    # (see https://sandro-keil.de/blog/2017/07/24/let-nginx-start-if-upstream-host-is-unavailable-or-down/)
    set $upstream django:8000;

    proxy_set_header  Host $http_host;
    proxy_set_header  X-Real-IP $remote_addr;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header  X-Frame-Options ALLOWALL;

    uwsgi_pass $upstream;

    # when a client closes the connection then keep the channel to uwsgi open. Otherwise uwsgi throws an IOError
    uwsgi_ignore_client_abort on;

    if ($blocked_agent) {
        return 403;
    }

    deny 34.223.64.16; # deny AWS IP address that scans for vulnerabilities
    deny 203.188.164.188;
    deny 85.208.96.193;
    deny 77.75.77.109;
    deny 3.219.81.66;
    deny 37.59.204.150;
    deny 34.201.223.161;
    deny 34.68.34.80;
    deny 34.174.204.235;
    deny 34.174.177.71;
    deny 124.156.187.113;
    deny 88.99.80.227;
    deny 103.125.189.124;

}
